# loupe on GitLab CI — reviews merge requests with inline, line-anchored
# comments. Copy this job into your repo's .gitlab-ci.yml (or `include:` it
# remotely — see docs/gitlab.md).
#
# Setup:
#   1. Create a project access token with the `api` scope (Maintainer role)
#      in the repo being reviewed, and add it as a masked CI/CD variable
#      named GITLAB_TOKEN.
#   2. Point `image:` at a loupe image. The one below is built by this
#      repo's own CI (.gitlab-ci.yml pushes it to the project registry) and
#      bundles bun 1.3.14, git, and the whip harness. Same-instance jobs can
#      pull it directly; from another instance, log in to the registry first
#      or build your own from the Dockerfile in this repo.
#   3. Optionally commit a .loupe.json for reviewer profiles; point
#      LOUPE_CONFIG at it. Every LOUPE_* knob from the GitHub Action works
#      here too.
loupe-review:
  image: gitlab.nexttuesday.de:4567/admetrics/loupe:main
  rules:
    # only merge-request pipelines; branch/tag pipelines are skipped
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    # The image has loupe at /loupe with dependencies installed — just run
    # the CI entry. $CI_PROJECT_DIR (the MR checkout) stays loupe's workdir.
    - bun run /loupe/packages/action/src/main.ts
  variables:
    # Harness config (or commit .loupe.json and set LOUPE_CONFIG: .loupe.json):
    LOUPE_HARNESS: whip
    # LOUPE_MODEL: glm-5.3
    # LOUPE_REASONING: medium
    # Harness keys ride the credential chain (default provider: env):
    # ZAI_API_KEY / DEEPSEEK_API_KEY / ANTHROPIC_API_KEY / ...
