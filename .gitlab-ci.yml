# loupe's CI on GitLab: build the container image and push it to this
# project's registry (registry.<host>/admetrics/loupe). On main both a
# $CI_COMMIT_SHORT_SHA tag and the moving :main tag are pushed; on merge
# requests the image is built (no push) to catch Dockerfile breakage.
#
# Prereqs on the instance: a runner with Docker-in-Docker support (the
# docker:27 image + dind service below) and the container registry enabled
# (it is, for this project). The registry login uses the CI job token —
# no extra secrets needed.
stages: [build]

docker:image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:main" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:main"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

docker:image:mr:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build --pull -t loupe:mr .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# loupe reviews its own MRs with the image built above. Credentials come from
# CI variables: GITLAB_TOKEN (project variable — a project access token with
# api scope) posts the review; DEEPSEEK_API_KEY (group variable) reaches the
# model via the whip provider panel in .loupe/gitlab.json.
loupe-review:
  stage: build
  image: $CI_REGISTRY_IMAGE:main
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    LOUPE_CONFIG: .loupe/gitlab.json
  script:
    - bun run /loupe/packages/action/src/main.ts
